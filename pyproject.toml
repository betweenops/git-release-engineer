[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlab-ai-release-engineer"
version = "0.1.0"
description = "CLI scaffolding for release analysis against manifest-driven release definitions."
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
